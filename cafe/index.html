<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starbucks-style cafe v1 · sand3d</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d8e0e6; font-family: ui-sans-serif, system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 2;
      background: rgba(20,28,24,0.72); color: #f4f1ea; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 280px;
      backdrop-filter: blur(6px);
    }
    #hud h1 { margin: 0 0 4px; font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
    #hud .row { display: flex; gap: 6px; margin-top: 8px; }
    #hud button {
      border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
      background: #1e3932; color: #f4f1ea; font-weight: 600; font-size: 12px;
    }
    #hud button:hover { background: #2f5a4d; }
    #hud #status { opacity: 0.85; margin-top: 6px; font-size: 12px; }
    #hud #mode { font-variant-numeric: tabular-nums; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h1>Cafe v1 dense · sand3d kit</h1>
    <div>Shading: <strong id="mode">TOON</strong></div>
    <div class="row">
      <button id="btn-toon" type="button">Toon (T)</button>
      <button id="btn-unlit" type="button">Unlit (U)</button>
    </div>
    <div id="status">boot…</div>
  </div>
  <canvas id="c"></canvas>
  <script type="module" src="./cafe.js"></script>
</body>
</html>
