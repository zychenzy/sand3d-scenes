<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afterglow Records · sand3d</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e6b15a'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a211e; font-family: ui-sans-serif, system-ui, sans-serif; }

      position: fixed; left: 12px; top: 12px; z-index: 2;
      background: rgba(28, 16, 14, 0.78); color: #f6efe4; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 340px;
    }

    #hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    #hud button {
      border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
      background: #6e3a28; color: #f6efe4; font-weight: 600; font-size: 12px;
    }
    #hud button:hover { filter: brightness(1.12); }
    #hud #status { opacity: 0.85; margin-top: 6px; font-size: 12px; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <h1>Afterglow Records · evening</h1>
    <div>Shading: <strong id="mode">TOON</strong></div>
    <div class="row">
      <button id="btn-toon" type="button">Toon (T)</button>
      <button id="btn-unlit" type="button">Unlit (U)</button>
      <button id="btn-default" type="button">Wide (1)</button>
      <button id="btn-corner" type="button">Corner (2)</button>

</html>
