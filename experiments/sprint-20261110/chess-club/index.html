<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess clubhouse · sand3d</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%236b442c' width='16' height='16'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e6d7c4; font-family: ui-sans-serif, system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 2;
      background: rgba(42, 26, 16, 0.78); color: #f6efe4; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 320px;
      backdrop-filter: blur(6px);
    }
    #hud h1 { margin: 0 0 4px; font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
    #hud .row { display: flex; gap: 6px; margin-top: 8px; }
    #hud button {
      border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
      background: #6b442c; color: #f6efe4; font-weight: 600; font-size: 12px;
    }
    #hud button:hover { filter: brightness(1.15); }
    #hud #status { opacity: 0.85; margin-top: 6px; font-size: 12px; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <h1>Chess clubhouse · sand3d</h1>
    <div>Shading: <strong id="mode">TOON</strong></div>
    <div class="row">
      <button id="btn-toon" type="button">Toon (T)</button>
      <button id="btn-unlit" type="button">Unlit (U)</button>
    </div>
    <div id="status">boot…</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message || e.error || 'error')));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason || 'rejection')));
  </script>
  <script type="module" src="./chess.js"></script>
</body>
</html>
