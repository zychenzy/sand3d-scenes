<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atrium coffee · sand3d</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d5e0ea; font-family: Georgia, Palatino, serif; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 2;
      background: rgba(36, 28, 22, 0.78); color: #f6f0e6; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 300px;
    }
    #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 650; letter-spacing: 0.04em; }
    #hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    #hud button {
      border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
      background: #6d4c38; color: #f6f0e6; font-weight: 600; font-size: 12px;
      font-family: inherit;
    }
    #hud button:hover { background: #8a6148; }
    #hud #status { opacity: 0.85; margin-top: 6px; font-size: 12px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../../cafe/vendor/three.module.js"
    }
  }
  </script>

  <div id="hud">
    <h1>ATRIUM</h1>
    <div>Daylight coffee · shading <strong id="mode">TOON</strong></div>

      <button id="btn-unlit" type="button">Unlit (U)</button>
      <button id="btn-room" type="button">Room</button>
      <button id="btn-nook" type="button">Nook</button>
      <button id="btn-bar" type="button">Bar</button>
