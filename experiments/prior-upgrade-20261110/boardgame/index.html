<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Night Board · board-game room</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d8cbb8; font-family: Georgia, ui-serif, serif; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 2;
      background: rgba(42, 22, 28, 0.78); color: #f6efe4; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 280px;
    }
    #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }
    #hud .row { display: flex; gap: 6px; margin-top: 8px; }
    #hud button {
      border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
      background: #6a2436; color: #f6efe4; font-weight: 600; font-size: 12px;
    }
    #hud button:hover { filter: brightness(1.15); }
    #hud #status { opacity: 0.85; margin-top: 6px; font-size: 12px; }
  </style>
  <script type="importmap">
  { "imports": { "three": "../../../boardgame/vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <h1>The Night Board</h1>
    <div>Shading: <strong id="mode">TOON</strong></div>
    <div class="row">
      <button id="btn-toon" type="button">Toon (T)</button>
      <button id="btn-unlit" type="button">Unlit (U)</button>
    </div>
    <div id="status">boot…</div>
  </div>
  <canvas id="c"></canvas>
  <script type="module" src="./boardgame.js"></script>
</body>
</html>
